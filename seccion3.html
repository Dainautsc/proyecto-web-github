<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sección 3</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            line-height: 1.6; 
            margin: 0; 
            padding: 20px; 
            background: linear-gradient(135deg, #1b5e20, #2e7d32, #81c784); 
            color: #2c3e50; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .card { 
            background: #ffffff; 
            padding: 45px; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); 
            max-width: 700px; 
            width: 100%; 
            border-top: 6px solid #4caf50;
        }
        .badge {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }
        h1 { color: #1b5e20; margin-top: 15px; font-size: 1.8rem; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 35px; gap: 15px; }
        .btn { 
            padding: 12px 22px; 
            background: #4caf50; 
            color: #fff; 
            text-decoration: none; 
            border-radius: 10px; 
            font-weight: bold; 
            font-size: 14px; 
            border: none;
            cursor: pointer;
            display: inline-block;
            transition: all 0.3s ease; 
        }
        .btn:hover { background: #388e3c; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .btn-home { background: #455a64; }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">Sección 3 de 4</span>
        <h1>Soluciones y Acciones</h1>
        <p>Implementar energías limpias, reducir el consumo de plásticos de un solo uso y fomentar el reciclaje son pasos fundamentales para mitigar los daños al medio ambiente.</p>
        <div class="nav-buttons">
            <button onclick="location.href='seccion2.html'" class="btn">⬅ Anterior</button>
            <button onclick="location.href='index.html'" class="btn btn-home">🏠 Menú Principal</button>
            <button onclick="location.href='seccion4.html'" class="btn">Siguiente ➔</button>
        </div>
    </div>
</body>
</html>
